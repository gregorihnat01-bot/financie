<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Financie">
  <meta name="format-detection" content="telephone=no">
  <title>Financie</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>

  <header class="topbar">
    <h1 id="title" class="topbar__title">Schváliť</h1>
    <div class="topbar__actions">
      <button class="icon-btn" id="btn-add" aria-label="Pridať platbu">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button class="icon-btn" id="btn-settings" aria-label="Nastavenia">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
  </header>

  <main class="views">
    <section id="view-inbox" class="view" aria-label="Schváliť a vyriešiť"></section>
    <section id="view-overview" class="view" aria-label="Prehľad a analýza" hidden></section>
    <section id="view-tx" class="view" aria-label="Transakcie" hidden>
      <div class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="tx-search" type="search" placeholder="Hľadať obchodníka, poznámku, sumu…" autocomplete="off" enterkeyhint="search">
      </div>
      <div class="chips chips--scroll" id="tx-filters" role="tablist"></div>
      <div id="tx-list"></div>
    </section>
  </main>

  <nav class="tabbar" role="tablist">
    <button class="tab is-active" data-tab="inbox" role="tab" aria-selected="true">
      <span class="tab__icon">
        <svg viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>
        <span class="badge" id="inbox-badge" hidden></span>
      </span>
      <span class="tab__label">Schváliť</span>
    </button>
    <button class="tab" data-tab="overview" role="tab" aria-selected="false">
      <span class="tab__icon"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></span>
      <span class="tab__label">Prehľad</span>
    </button>
    <button class="tab" data-tab="tx" role="tab" aria-selected="false">
      <span class="tab__icon"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg></span>
      <span class="tab__label">Transakcie</span>
    </button>
  </nav>

  <div id="sheet-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input type="file" id="file-input" accept=".eml,.pdf,.txt,message/rfc822,application/pdf,text/plain" multiple hidden>
  <input type="file" id="backup-input" accept=".json,application/json" hidden>

  <noscript><p style="padding:24px">Aplikácia potrebuje JavaScript.</p></noscript>
  <script type="module" src="js/ui.js"></script>
</body>
</html>
