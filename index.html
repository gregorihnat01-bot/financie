<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Financie">
  <meta name="format-detection" content="telephone=no">
  <title>Financie</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="is-launching">
  <!-- Úvodná animácia: len pri otvorení appky (riadi ju skript nižšie, štýly v css/app.css → Splash) -->
  <div id="splash" class="splash" aria-hidden="true">
    <div class="splash__stage">
      <div class="splash__mark">
        <svg viewBox="80 38 352 392" width="56" height="62">
          <defs>
            <linearGradient id="splash-g" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#3ae374"/><stop offset="1" stop-color="#1a9e48"/>
            </linearGradient>
          </defs>
          <rect class="splash__bar splash__bar--1" x="96" y="300" width="64" height="116" rx="16" fill="#3a3a3c"/>
          <rect class="splash__bar splash__bar--2" x="192" y="232" width="64" height="184" rx="16" fill="#636366"/>
          <rect class="splash__bar splash__bar--3" x="288" y="168" width="64" height="248" rx="16" fill="url(#splash-g)"/>
          <g class="splash__arrow" fill="none" stroke="#30d158" stroke-width="28" stroke-linecap="round" stroke-linejoin="round">
            <path d="M300 118 352 66l52 52"/><path d="M352 70v120"/>
          </g>
        </svg>
      </div>
      <div class="splash__name">Financie</div>
      <div class="splash__glow"></div>
    </div>
  </div>
  <script>
    (function () {
      var el = document.getElementById('splash'), body = document.body, gone = false;
      function done() {
        if (gone) return;
        gone = true;
        body.classList.remove('is-launching', 'is-revealing');
        if (el && el.parentNode) el.parentNode.removeChild(el);
      }
      var seen = false;
      try { seen = sessionStorage.getItem('financie.splash') === '1'; sessionStorage.setItem('financie.splash', '1'); } catch (e) {}
      // Znovunačítanie v tej istej relácii alebo odkaz zo Skratiek → rovno dashboard
      if (seen || /[?&](add|import)=/.test(location.search)) { done(); return; }

      var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
      // Odchod začne hneď, ako dobehne posledný pohyb (bez mŕtvej pauzy)
      var minHold = reduce ? 400 : 780, start = Date.now(), left = false;
      function leave() {
        if (left) return;
        left = true;
        el.classList.add('is-leaving');
        body.classList.add('is-revealing');
        body.classList.remove('is-launching');
        setTimeout(done, reduce ? 300 : 520);
      }
      // Dashboard je vykreslený po DOMContentLoaded (moduly už dobehli). Nečakáme na 'load',
      // ten by čakal aj na požiadavky do Gmailu a úvodná obrazovka by zbytočne stála.
      function whenReady() { setTimeout(leave, Math.max(0, minHold - (Date.now() - start))); }
      if (document.readyState !== 'loading') whenReady();
      else document.addEventListener('DOMContentLoaded', whenReady);
      setTimeout(done, 5000); // poistka
    })();
  </script>
  <noscript><style>.splash { display: none; } body.is-launching .topbar, body.is-launching .views, body.is-launching .tabbar { opacity: 1; transform: none; }</style></noscript>

  <div class="ambient" aria-hidden="true"></div>

  <header class="topbar">
    <h1 id="title" class="topbar__title">Schváliť</h1>
    <div class="topbar__actions">
      <button class="icon-btn" id="btn-add" aria-label="Pridať platbu">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button class="icon-btn" id="btn-settings" aria-label="Nastavenia">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
  </header>

  <main class="views">
    <section id="view-inbox" class="view" aria-label="Schváliť a vyriešiť"></section>
    <section id="view-overview" class="view" aria-label="Prehľad a analýza" hidden></section>
    <section id="view-tx" class="view" aria-label="Transakcie" hidden>
      <div class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="tx-search" type="search" placeholder="lidl, šport, >50, september…" autocomplete="off" enterkeyhint="search">
      </div>
      <div class="chips chips--scroll" id="tx-filters" role="tablist"></div>
      <div id="tx-list"></div>
    </section>
  </main>

  <nav class="tabbar" role="tablist">
    <button class="tab is-active" data-tab="inbox" role="tab" aria-selected="true">
      <span class="tab__icon">
        <svg viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>
        <span class="badge" id="inbox-badge" hidden></span>
      </span>
      <span class="tab__label">Schváliť</span>
    </button>
    <button class="tab" data-tab="overview" role="tab" aria-selected="false">
      <span class="tab__icon"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></span>
      <span class="tab__label">Prehľad</span>
    </button>
    <button class="tab" data-tab="tx" role="tab" aria-selected="false">
      <span class="tab__icon"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg></span>
      <span class="tab__label">Transakcie</span>
    </button>
  </nav>

  <div id="sheet-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input type="file" id="file-input" accept=".eml,.pdf,.txt,.json,message/rfc822,application/pdf,text/plain,application/json" multiple hidden>
  <input type="file" id="backup-input" accept=".json,application/json" hidden>

  <noscript><p style="padding:24px">Aplikácia potrebuje JavaScript.</p></noscript>
  <script type="module" src="js/ui.js"></script>
</body>
</html>
